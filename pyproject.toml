[project]
name = "aclimate-mcp"
version = "0.1.0"
description = "MCP for AClimate API"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "aclimatesdkpy",
    "mcp[cli]>=1.10.0",
    "pydantic-settings>=2.0",
    "starlette>=0.40",
]

# Test-only dependencies. Installed by `uv sync --all-groups` (what CI runs)
# and excluded from `uv sync --no-dev` (what the Jenkins deploy runs).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[project.scripts]
aclimate-mcp = "aclimate_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aclimate_mcp"]

[tool.uv.sources]
aclimatesdkpy = { git = "https://github.com/CIAT-DAPA/aclimatesdkpy.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
